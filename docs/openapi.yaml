                    last_page: 1
                    per_page: 10
                    from: 1
                    to: 3
                    total: 3
                  links: []
                  error: null
                properties:
                  data:
                    type: array
                    example: []
                  meta:
                    type: object
                    properties:
                      favoris:
                        type: boolean
                        example: true
                      count:
                        type: integer
                        example: 3
                      current_page:
                        type: integer
