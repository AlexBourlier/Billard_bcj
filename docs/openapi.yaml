openapi: 3.0.3
info:
  title: 'BCJ - Billard club de Joué-Lès-Tours API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Articles
    description: ''
  -
    name: Calendriers
    description: ''
  -
    name: Classements
    description: ''
  -
    name: CueScore
    description: ''
  -
    name: Disciplines
    description: 'La réponse est mise en cache pendant 10 minutes.'
  -
    name: Documents
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: Licenciés
    description: "La recherche est partielle (LIKE %value%).\nLes résultats sont dédupliqués et limités aux champs utiles."
  -
    name: Public
    description: "La réponse est mise en cache pendant 10 minutes.\n\nL’article mis en avant correspond au dernier article favori.\nSi aucun article favori n’existe, le dernier article publié est utilisé en fallback."
paths:
  /api/v1/posts:
    get:
      summary: 'Liste des articles'
      operationId: listeDesArticles
      description: 'Retourne la liste paginée des articles, triés du plus récent au plus ancien.'
      parameters:
        -
          in: query
          name: per_page
          description: 'Nombre d’articles par page. Min: 1. Max: 100. Default: 10. Exemple : 10'
          example: 16
          required: false
          schema:
            type: integer
            description: 'Nombre d’articles par page. Min: 1. Max: 100. Default: 10. Exemple : 10'
            example: 16
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  meta:
                    count: 25
                    current_page: 1
                    last_page: 3
                    per_page: 10
                    from: 1
                    to: 10
                    total: 25
                  links:
                    first: 'http://127.0.0.1:8000/api/v1/posts?page=1'
                    last: 'http://127.0.0.1:8000/api/v1/posts?page=3'
                    prev: null
                    next: 'http://127.0.0.1:8000/api/v1/posts?page=2'
                  error: null
                properties:
                  data:
                    type: array
                    example: []
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 25
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 3
                      per_page:
                        type: integer
                        example: 10
                      from:
                        type: integer
                        example: 1
                      to:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 25
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/posts?page=1'
                      last:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/posts?page=3'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/posts?page=2'
                  error:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Articles
      security: []
  /api/v1/posts/favoris:
