\">Elle se positionne d\u00e9sormais&nbsp;5\u1d49 au classement g\u00e9n\u00e9ral<\/p><p><br><\/p><h5><strong class=\"ql-size-large\" style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t8d\/1\/16\/1f500.png\" alt=\"\ud83d\udd00\" height=\"16\" width=\"16\">&nbsp;Cat\u00e9gorie Mixte<\/strong><\/h5><ul><li>J\u00e9r\u00f4me L''Anthoen&nbsp;atteint les&nbsp;1\/4 de finale&nbsp;apr\u00e8s&nbsp;4 matchs remport\u00e9s.<\/li><\/ul><p class=\"ql-indent-2\">Malgr\u00e9 une d\u00e9faite au 1er tour du tournoi v\u00e9t\u00e9ran, il r\u00e9alise une tr\u00e8s belle op\u00e9ration au mixte.<\/p><p class=\"ql-indent-2\">4\u1d49 place au classement g\u00e9n\u00e9ral&nbsp;!<\/p><p><br><\/p><h5><strong class=\"ql-size-large\" style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t8b\/1\/16\/1f465.png\" alt=\"\ud83d\udc65\" height=\"16\" width=\"16\">&nbsp;Comp\u00e9tition \u00c9quipes \u2013 DN1<\/strong><\/h5><ul><li><strong>Jou\u00e9 1<\/strong><\/li><\/ul><p class=\"ql-indent-2\">3 victoires en 3 matchs<\/p><p class=\"ql-indent-2\">Dernier match remport\u00e9 avec le&nbsp;point offensif&nbsp;et&nbsp;5 fermes<\/p><p class=\"ql-indent-2\">Jou\u00e9 1 conserve sa 2\u1d49 place au classement<\/p><ul><li><strong>Jou\u00e9 2<\/strong><\/li><\/ul><p class=\"ql-indent-2\">Victoire lors du premier match<\/p><p class=\"ql-indent-2\">D\u00e9faites sur les deux suivants, avec&nbsp;1 point d\u00e9fensif&nbsp;r\u00e9cup\u00e9r\u00e9<\/p><p class=\"ql-indent-2\">Une journ\u00e9e compliqu\u00e9e qui les fait descendre \u00e0 la&nbsp;4\u1d49 place<\/p><p class=\"ql-indent-2\"><em>Mais rien n\u2019est jou\u00e9 : la saison continue !<\/em><\/p><p><br><\/p><p><br><\/p><p>F\u00e9licitations \u00e0 l\u2019ensemble des joueurs pour leur engagement et leurs performances<\/p>","discipline":"blackball","discipline_id":1,"year":2026,"favoris":true,"image":null,"image_url":null,"video":"https:\/\/sportenfrance.com\/videos\/x9yzs4s","created_at":"2026-02-02T08:11:13.000000Z","updated_at":"2026-02-02T08:31:49.000000Z"},{"id":111,"title":"4e Tournoi International de Para-Billard","slug":"4e-tournoi-international-de-para-billard","excerpt":"Venez vivre un \u00e9v\u00e9nement sportif d\u2019exception o\u00f9 des joueurs et joueuses de para-billard, venus de toute la France et de l\u2019international, s\u2019affrontent...","content":"<p>Venez vivre un \u00e9v\u00e9nement sportif d\u2019exception o\u00f9 des joueurs et joueuses de para-billard, venus de toute la France et de l\u2019international, s\u2019affrontent au plus haut niveau.<\/p><p>Pendant plusieurs jours, pr\u00e9cision, ma\u00eetrise, strat\u00e9gie et mental seront au c\u0153ur de matchs intenses, en individuel et par \u00e9quipes. Ici, la performance prime, le handicap s\u2019efface, et le billard devient un v\u00e9ritable spectacle de haut niveau.<\/p><h3><br><\/h3><h3><strong>Pourquoi venir ?<\/strong><\/h3><ul><li><strong>Un sport spectaculaire et exigeant<\/strong><\/li><\/ul><p class=\"ql-indent-1\">D\u00e9couvrez le para-billard comme vous ne l\u2019avez jamais vu : des parties engag\u00e9es, une concentration extr\u00eame et un niveau de jeu impressionnant.<\/p><ul><li><strong>Des athl\u00e8tes inspirants<\/strong><\/li><\/ul><p class=\"ql-indent-1\">Rencontrez des comp\u00e9titeurs qui repoussent leurs limites \u00e0 chaque coup, port\u00e9s par la passion, la rigueur et l\u2019envie de se d\u00e9passer.<\/p><ul><li><strong>Une comp\u00e9tition internationale<\/strong><\/li><\/ul><p class=\"ql-indent-1\">Assistez \u00e0 des confrontations entre joueurs venus de diff\u00e9rents horizons, dans une ambiance \u00e0 la fois sportive, conviviale et respectueuse.<\/p><ul><li><strong>Un moment fort en \u00e9motions<\/strong><\/li><\/ul><p class=\"ql-indent-1\">Que vous soyez amateur de billard ou simple curieux, ce tournoi promet des instants intenses, authentiques et m\u00e9morables.<\/p><p><br><\/p><p>\ud83d\udc49 <strong>Entr\u00e9e gratuite \u2013 Tout public bienvenu<\/strong><\/p><p class=\"ql-indent-1\">Venez soutenir le para-billard et partager une vision inclusive et exigeante du sport.<\/p><h3><br><\/h3><p><br><\/p><p><strong>English version<\/strong><\/p><h2><strong>4th International Para-Billiards Tournament<\/strong><\/h2><p><br><\/p><p>Come and experience an exceptional sporting event where para-billiards players from across France and beyond compete at the highest level.<\/p><p>For several days, precision, strategy, focus and mental strength will define intense individual and team matches. Here, performance comes first, disability fades away, and billiards becomes a true high-level sporting spectacle.<\/p><h3><br><\/h3><h3><strong>Why attend?<\/strong><\/h3><ul><li><strong>A demanding and spectacular sport<\/strong><\/li><\/ul><p class=\"ql-indent-1\">Discover para-billiards in a new light, with high-intensity matches and remarkable technical skill.<\/p><ul><li><strong>Inspiring athletes<\/strong><\/li><\/ul><p class=\"ql-indent-1\">Meet competitors who push their limits at every shot, driven by passion, discipline and determination.<\/p><ul><li><strong>An international competition<\/strong><\/li><\/ul><p class=\"ql-indent-1\">Enjoy exciting match-ups between players from different countries in a respectful and welcoming atmosphere.<\/p><ul><li><strong>A powerful emotional experience<\/strong><\/li><\/ul><p class=\"ql-indent-1\">Whether you are a billiards enthusiast or simply curious, this tournament promises unforgettable moments.<\/p><p><br><\/p><p>\ud83d\udc49 <strong>Free admission \u2013 Open to all<\/strong><\/p>","discipline":null,"discipline_id":null,"year":2026,"favoris":false,"image":"files\/2426c8a6d74304637b1bce1649ae7113.png","image_url":"http:\/\/localhost:8000\/files\/2426c8a6d74304637b1bce1649ae7113.png","video":null,"created_at":"2026-01-15T14:48:08.000000Z","updated_at":"2026-01-15T16:40:34.000000Z"},{"id":110,"title":"Soir\u00e9e d\u00e9couverte - Billard au f\u00e9minin","slug":"soiree-decouverte-billard-au-feminin","excerpt":" Soir\u00e9e d\u00e9couverte billard \u2013 Sp\u00e9ciale femmes&nbsp;Le Billard Club de Jou\u00e9-L\u00e8s-Tours ouvre ses portes pour une soir\u00e9e d\u00e9couverte r\u00e9serv\u00e9e aux femmes no...","content":"<p><span style=\"background-color: rgb(255, 255, 255);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9a\/1\/16\/1f3b1.png\" alt=\"\ud83c\udfb1\" height=\"16\" width=\"16\"> <\/span>Soir\u00e9e d\u00e9couverte billard \u2013 Sp\u00e9ciale femmes&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9a\/1\/16\/1f3b1.png\" alt=\"\ud83c\udfb1\" height=\"16\" width=\"16\"><\/p><p>Le Billard Club de Jou\u00e9-L\u00e8s-Tours ouvre ses portes pour une soir\u00e9e d\u00e9couverte r\u00e9serv\u00e9e aux femmes non adh\u00e9rentes, plac\u00e9e sous le signe de la convivialit\u00e9 et de la bonne humeur.<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t51\/1\/16\/1f449.png\" alt=\"\ud83d\udc49\" height=\"16\" width=\"16\">&nbsp;Envie de passer une soir\u00e9e sympa entre copines ?<\/p><p>Venez d\u00e9couvrir le billard anglais et le billard fran\u00e7ais, \u00e9changer avec les adh\u00e9rent(e)s du club et participer \u00e0 de petites animations accessibles \u00e0 toutes, d\u00e9butantes comme curieuses !<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tf4\/1\/16\/2728.png\" alt=\"\u2728\" height=\"16\" width=\"16\">&nbsp;Soir\u00e9e gratuite (hors consommations)<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tc0\/1\/16\/1f4e9.png\" alt=\"\ud83d\udce9\" height=\"16\" width=\"16\">&nbsp;R\u00e9servation obligatoire par mail pour des raisons d\u2019organisation : contact@bcj37.fr<\/p>","discipline":null,"discipline_id":null,"year":2026,"favoris":false,"image":"files\/64c9506646739859b7ce34856bf71804.png","image_url":"http:\/\/localhost:8000\/files\/64c9506646739859b7ce34856bf71804.png","video":null,"created_at":"2026-01-05T09:08:12.000000Z","updated_at":"2026-02-02T08:09:58.000000Z"},{"id":109,"title":"\ud83c\udfa5 TN3 Am\u00e9ricain - Jeu de la 8 - le 05 d\u00e9cembre 2025","slug":"tn3-americain-jeu-de-la-8-le-05-decembre-2025","excerpt":"\ud83d\udccd Schiltigheim\ud83d\udcc5 05 d\u00e9cembre 2025\ud83c\udfb1 TN3 Am\u00e9ricain \u2013 Jeu de la 8\ud83c\udfc6 Organisateur : BC1935Ambiance de grand rendez-vous national \u00e0 Schiltigheim pour ce...","content":"<p>\ud83d\udccd <strong>Schiltigheim<\/strong><\/p><p>\ud83d\udcc5 <strong>05 d\u00e9cembre 2025<\/strong><\/p><p>\ud83c\udfb1 <strong>TN3 Am\u00e9ricain \u2013 Jeu de la 8<\/strong><\/p><p>\ud83c\udfc6 <strong>Organisateur : BC1935<\/strong><\/p><p><br><\/p><p>Ambiance de grand rendez-vous national \u00e0 Schiltigheim pour ce TN3 Am\u00e9ricain \u2013 Jeu de la 8, avec une journ\u00e9e intense, des matchs accroch\u00e9s et un niveau de jeu remarquable tout au long de la comp\u00e9tition.<\/p><p><br><\/p><p>\ud83d\udd25 <strong>Finale au sommet<\/strong> :<\/p><p><strong class=\"ql-size-large\"> \ud83d\udc49 <em>Christophe Lambert \ud83c\udd9a Aymeric Luneau<\/em><\/strong><\/p><p><br><\/p><p>Une finale spectaculaire, tendue et engag\u00e9e, \u00e0 revivre en vid\u00e9o, o\u00f9 chaque bille comptait.<\/p><p>\ud83d\udc4f <strong>F\u00e9licitations \u00e0 Christophe Lambert<\/strong>, qui s\u2019impose et remporte le tournoi national !<\/p><p><br><\/p><p>\ud83d\udcca <strong>Stat incroyable<\/strong> :<\/p><p>\u27a1\ufe0f 2 participations sur 3 tournois<\/p><p>\u27a1\ufe0f 2 victoires<\/p><p>Une r\u00e9gularit\u00e9 et une efficacit\u00e9 impressionnantes au plus haut niveau \ud83d\udcaa\ud83d\udd25<\/p>","discipline":"americain","discipline_id":4,"year":2025,"favoris":false,"image":null,"image_url":null,"video":"https:\/\/www.youtube.com\/live\/6BBnr61RyxI","created_at":"2025-12-16T11:00:00.000000Z","updated_at":"2026-01-05T09:06:27.000000Z"},{"id":108,"title":"BILAN CARAMBOLE \u2013 PREMIER SEMESTRE","slug":"bilan-carambole-premier-semestre","excerpt":"Un d\u00e9but de saison riche, dynamique et plein de belles ambitions pour la section Carambole du BCJ !\ud83d\udd39 1 \u2013 Organisation de la saisonLa r\u00e9union du 1er o...","content":"<p>Un d\u00e9but de saison riche, dynamique et plein de belles ambitions pour la section Carambole du BCJ !<\/p><p><br><\/p><h2>\ud83d\udd39 <strong>1 \u2013 Organisation de la saison<\/strong><\/h2><p>La r\u00e9union du <strong>1er octobre<\/strong> a permis de lancer les bases d\u2019une saison structur\u00e9e et motivante :<\/p><ul><li>Mise en place des comp\u00e9titions internes :<\/li><li>\ud83d\udc49 Deux poules en <strong>parties libres<\/strong><\/li><li>\ud83d\udc49 Une poule unique en <strong>bande<\/strong>, <strong>trois bandes<\/strong> et <strong>casin<\/strong><\/li><li>\ud83c\udfaf Handicaps d\u00e9finis selon ceux de la FFB ou adapt\u00e9s pour les nouveaux joueurs.<\/li><li>Mise en place des <strong>challenges<\/strong> :<\/li><li>\ud83d\udc49 3 \u00e9quipes <strong>V\u00e9t\u00e9rans<\/strong><\/li><li>\ud83d\udc49 1 \u00e9quipe <strong>Casin<\/strong><\/li><li>\ud83d\udc49 2 \u00e9quipes <strong>Foulon<\/strong><\/li><li>\ud83d\udc49 1 \u00e9quipe <strong>Flambeau<\/strong><\/li><li>Avec, pour chaque \u00e9quipe, un responsable d\u00e9di\u00e9.<\/li><\/ul><p><br><\/p><h2>\ud83d\udd39 <strong>2 \u2013 R\u00e9sultats partiels des challenges<\/strong><\/h2><p>Quelques belles performances \u00e0 ce stade de la saison :<\/p><p>\ud83c\udfc5 <strong>V\u00e9t\u00e9rans<\/strong> (15 \u00e9quipes engag\u00e9es)<\/p><p>Deux de nos \u00e9quipes pointent \u00e0 la <strong>4\u1d49 et 5\u1d49 place<\/strong> apr\u00e8s le 4\u1d49 tour. La troisi\u00e8me reste motiv\u00e9e malgr\u00e9 un classement plus bas.<\/p><p>\ud83c\udfc5 <strong>Casin<\/strong> (8 \u00e9quipes engag\u00e9es)<\/p><p>Notre \u00e9quipe se situe actuellement <strong>au milieu du classement<\/strong> apr\u00e8s quatre tours.<\/p><p>\ud83c\udfc5 <strong>Foulon<\/strong> (4 \u00e9quipes engag\u00e9es)<\/p><p>Super d\u00e9but ! Une \u00e9quipe est <strong>1\u02b3\u1d49<\/strong>, l\u2019autre occupe la <strong>3\u1d49 place<\/strong> apr\u00e8s deux tours.<\/p><p>\ud83c\udfc5 <strong>Flambeau<\/strong> (8 \u00e9quipes engag\u00e9es)<\/p><p>Excellente performance : Jou\u00e9 est <strong>en t\u00eate du classement<\/strong> apr\u00e8s quatre tours !<\/p><p><br><\/p><h2>\ud83d\udd39 <strong>3 \u2013 Comp\u00e9titions internes<\/strong><\/h2><p>Les comp\u00e9titions <strong>Libre<\/strong> et <strong>Bande<\/strong> sont r\u00e9guli\u00e8rement suivies avec une fr\u00e9quentation moyenne de <strong>18 %<\/strong>, m\u00eame si elle varie selon les joueurs inscrits.<\/p><p>La participation est plus faible pour les autres disciplines, mais l\u2019esprit de comp\u00e9tition reste bien pr\u00e9sent !<\/p><p><br><\/p><h2>\ud83d\udd39 <strong>4 \u2013 Comp\u00e9titions individuelles CSDB37<\/strong><\/h2><p>Quatre joueurs repr\u00e9sentent le club dans plusieurs disciplines : <strong>libre<\/strong>, <strong>bande<\/strong> et <strong>trois bandes<\/strong>.<\/p><p>Les r\u00e9sultats du premier tour restent <strong>provisoires<\/strong>, mais la motivation est bien l\u00e0 !<\/p><p><br><\/p><p><br><\/p><p>\ud83d\udc4f <strong>Bravo \u00e0 tous les joueurs pour leur engagement, leur bonne humeur et leur esprit sportif !<\/strong><\/p><p><br><\/p><p>Continuons sur cette belle dynamique pour la suite de la saison.<\/p><p>Allez Jou\u00e9-L\u00e8s-Tours !<\/p>","discipline":"carambole","discipline_id":2,"year":2025,"favoris":false,"image":"files\/a2753a3bea67bdf240e2e537b5098965.png","image_url":"http:\/\/localhost:8000\/files\/a2753a3bea67bdf240e2e537b5098965.png","video":null,"created_at":"2025-12-05T11:00:00.000000Z","updated_at":"2025-12-05T10:54:40.000000Z"},{"id":107,"title":"\ud83c\udfb1 Tournoi R\u00e9gional Blackball n\u00b03 2025 \u00e0 Jou\u00e9-L\u00e8s-Tours","slug":"tournoi-regional-blackball-n3-2025-a-joue-les-tours","excerpt":"&nbsp;Gymnase Matarazzo&nbsp;Du 12 au 14 d\u00e9cembre 2025Ce week-end restera une tr\u00e8s belle \u00e9tape dans la vie du club&nbsp;Il s\u2019agissait de la&nbsp;premi...","content":"<p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t2d\/1\/16\/1f4cd.png\" alt=\"\ud83d\udccd\" height=\"16\" width=\"16\">&nbsp;Gymnase Matarazzo<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t7e\/1\/16\/1f4c5.png\" alt=\"\ud83d\udcc5\" height=\"16\" width=\"16\">&nbsp;Du 12 au 14 d\u00e9cembre 2025<\/p><p><br><\/p><p>Ce week-end restera une tr\u00e8s belle \u00e9tape dans la vie du club&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t6c\/1\/16\/1f499.png\" alt=\"\ud83d\udc99\" height=\"16\" width=\"16\"><\/p><p><br><\/p><p>Il s\u2019agissait de la&nbsp;premi\u00e8re organisation d\u2019un tournoi r\u00e9gional&nbsp;depuis le changement de pr\u00e9sident et la r\u00e9organisation de l\u2019\u00e9quipe dirigeante. Et quelle r\u00e9ussite !<\/p><p><br><\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tfe\/1\/16\/1f44f.png\" alt=\"\ud83d\udc4f\" height=\"16\" width=\"16\">&nbsp;Les b\u00e9n\u00e9voles ont r\u00e9pondu pr\u00e9sents, et en masse !<\/p><p>Gr\u00e2ce \u00e0 votre mobilisation, l\u2019installation \u00e9tait quasiment finalis\u00e9e d\u00e8s le&nbsp;jeudi soir \u00e0 23h15, le d\u00e9montage s\u2019est termin\u00e9&nbsp;dimanche \u00e0 20h, permettant aux b\u00e9n\u00e9voles du lundi matin de finaliser le rangement dans le calme et la s\u00e9r\u00e9nit\u00e9.<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t96\/1\/16\/1f37b.png\" alt=\"\ud83c\udf7b\" height=\"16\" width=\"16\">&nbsp;Mention sp\u00e9ciale \u00e0 la buvette&nbsp;:<\/p><p>Le roulement parfaitement organis\u00e9 par&nbsp;Isabelle&nbsp;a permis d\u2019\u00e9quilibrer les t\u00e2ches et de vous accueillir tout le week-end avec le sourire.<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t80\/1\/16\/1f64f.png\" alt=\"\ud83d\ude4f\" height=\"16\" width=\"16\">&nbsp;Un immense MERCI \u00e0 tous les b\u00e9n\u00e9voles, sans qui rien ne serait possible. Vous \u00eates la force du club&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t6c\/1\/16\/2764.png\" alt=\"\u2764\ufe0f\" height=\"16\" width=\"16\"><\/p><p><br><\/p><p>Nous tenions \u00e9galement \u00e0 remercier chaleureusement&nbsp;l\u2019\u00e9quipe municipale,&nbsp;Mr Osmond&nbsp;et&nbsp;Mr Cravenaud, pour sa pr\u00e9sence lors de la remise des troph\u00e9es.<\/p><p>Merci \u00e0&nbsp;Mme Patry&nbsp;(directrice des sports de Jou\u00e9-L\u00e8s-Tours) d\u2019\u00eatre pass\u00e9e nous voir le samedi, ainsi qu\u2019\u00e0&nbsp;Mr Moulay&nbsp;(vice-pr\u00e9sident de la r\u00e9gion)&nbsp;pour sa venue&nbsp;dimanche, \u00e0 l\u2019improviste, t\u00e9moignant de l\u2019int\u00e9r\u00eat port\u00e9 \u00e0 la vie sportive et associative locale.<\/p><p>Votre pr\u00e9sence et votre soutien sont tr\u00e8s appr\u00e9ci\u00e9s par le club et ses b\u00e9n\u00e9voles&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t80\/1\/16\/1f64f.png\" alt=\"\ud83d\ude4f\" height=\"16\" width=\"16\"><\/p><p><br><\/p><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tbe\/1\/16\/1f3c6.png\" alt=\"\ud83c\udfc6\" height=\"16\" width=\"16\">&nbsp;R\u00c9SULTATS SPORTIFS \u2013 BCJ EN HAUSSE !<\/strong><\/h5><p>Le BCJ a clairement&nbsp;hauss\u00e9 son niveau, avec de tr\u00e8s belles performances qui donnent beaucoup d\u2019espoir pour l\u2019avenir&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t50\/1\/16\/1f525.png\" alt=\"\ud83d\udd25\" height=\"16\" width=\"16\"><\/p><p><br><\/p><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t60\/1\/16\/1f51d.png\" alt=\"\ud83d\udd1d\" height=\"16\" width=\"16\">&nbsp;Top Ligue<\/strong><\/h5><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;Yvan SKNOEZECK&nbsp;s\u2019arr\u00eate en&nbsp;1\/8e de finale&nbsp;et se classe&nbsp;7e au g\u00e9n\u00e9ral<\/p><p><br><\/p><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/te9\/1\/16\/2640.png\" alt=\"\u2640\ufe0f\" height=\"16\" width=\"16\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/teb\/1\/16\/2642.png\" alt=\"\u2642\ufe0f\" height=\"16\" width=\"16\">&nbsp;Mixte<\/strong><\/h5><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;Darius &amp; Tarik&nbsp;r\u00e9alisent un superbe parcours en atteignant les&nbsp;1\/4 de finale<\/p><ul><li>Darius GANNAT&nbsp;(entr\u00e9 au 1er tour) remporte&nbsp;5 victoires<\/li><li>Tarik BOUATTAOUN, \u00e0 quelques secondes d\u2019\u00e9galiser pour acc\u00e9der aux 1\/2 finales, se fait rattraper par le timer\u2026<\/li><li><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;Il se classe tout de m\u00eame&nbsp;10e au g\u00e9n\u00e9ral, une tr\u00e8s belle performance&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t6c\/1\/16\/1f4aa.png\" alt=\"\ud83d\udcaa\" height=\"16\" width=\"16\"><\/li><\/ul><p><br><\/p><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t62\/1\/16\/1f9d1_200d_1f393.png\" alt=\"\ud83e\uddd1\u200d\ud83c\udf93\" height=\"16\" width=\"16\">&nbsp;U23<\/strong><\/h5><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t15\/1\/16\/1f948.png\" alt=\"\ud83e\udd48\" height=\"16\" width=\"16\">&nbsp;Victoire de Math\u00e9o BOUTEILLE<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;Il se positionne&nbsp;2e au classement g\u00e9n\u00e9ral<\/p><p>Le club nourrit&nbsp;beaucoup d\u2019espoirs&nbsp;pour la suite&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/ted\/1\/16\/1f4ab.png\" alt=\"\ud83d\udcab\" height=\"16\" width=\"16\"><\/p><h5><br><\/h5><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tdf\/1\/16\/1f9d2.png\" alt=\"\ud83e\uddd2\" height=\"16\" width=\"16\">&nbsp;U15<\/strong><\/h5><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t94\/1\/16\/1f947.png\" alt=\"\ud83e\udd47\" height=\"16\" width=\"16\">&nbsp;Encore l\u2019or pour Cl\u00e9ment DA COSTA, qui continue de dominer le classement g\u00e9n\u00e9ral<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;Le travail \u00e0 l\u2019entra\u00eenement paie, bravo \u00e0 toi&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tfe\/1\/16\/1f44f.png\" alt=\"\ud83d\udc4f\" height=\"16\" width=\"16\"><\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tfe\/1\/16\/1f44f.png\" alt=\"\ud83d\udc4f\" height=\"16\" width=\"16\">&nbsp;Bravo \u00e9galement \u00e0 Djino WAGON, demi-finaliste, qui se classe&nbsp;5e au g\u00e9n\u00e9ral<\/p><p><br><\/p><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tfc\/1\/16\/267f.png\" alt=\"\u267f\" height=\"16\" width=\"16\">&nbsp;Handi-fauteuil<\/strong><\/h5><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t94\/1\/16\/1f947.png\" alt=\"\ud83e\udd47\" height=\"16\" width=\"16\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t15\/1\/16\/1f948.png\" alt=\"\ud83e\udd48\" height=\"16\" width=\"16\">&nbsp;Finale 100 % jocondienne<\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;Victoire de&nbsp;Tristan PIERROT&nbsp;face \u00e0&nbsp;Thomas RAINEAU&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t6c\/1\/16\/1f499.png\" alt=\"\ud83d\udc99\" height=\"16\" width=\"16\"><\/p><p><br><\/p><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t72\/1\/16\/1f9cd.png\" alt=\"\ud83e\uddcd\" height=\"16\" width=\"16\">&nbsp;Handi-debout<\/strong><\/h5><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;J\u00e9r\u00f4me JUSSY&nbsp;s\u2019arr\u00eate aux portes des&nbsp;1\/2 finales<\/p><p><br><\/p><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/ta9\/1\/16\/1f474.png\" alt=\"\ud83d\udc74\" height=\"16\" width=\"16\">&nbsp;V\u00e9t\u00e9rans<\/strong><\/h5><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;Darius GANNAT&nbsp;s\u2019incline en&nbsp;1\/8e de finale, \u00e0 tr\u00e8s peu de choses pr\u00e8s<\/p><p><br><\/p><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t8b\/1\/16\/1f465.png\" alt=\"\ud83d\udc65\" height=\"16\" width=\"16\">&nbsp;CHAMPIONNATS PAR \u00c9QUIPES<\/strong><\/h5><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tef\/1\/16\/1f535.png\" alt=\"\ud83d\udd35\" height=\"16\" width=\"16\">&nbsp;\u00c9quipe DR2 \u2013 Jou\u00e9 1<\/strong><\/h5><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;Journ\u00e9e frustrante pour cette&nbsp;premi\u00e8re saison en DR2,&nbsp;le r\u00e9sultat n''est pas repr\u00e9sentatif du niveau de jeu r\u00e9alis\u00e9.<\/p><ul><li>2 d\u00e9faites \u00e0&nbsp;une partie du point d\u00e9fensif<\/li><li>1 \u00e9galit\u00e9 apr\u00e8s avoir men\u00e9&nbsp;8\u20136<\/li><li><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tfb\/1\/16\/1f5e3.png\" alt=\"\ud83d\udde3\ufe0f\" height=\"16\" width=\"16\">&nbsp;<em>\u00ab C\u2019est rageant, mais encourageant ! \u00bb<\/em>&nbsp;(le capitaine)<\/li><li><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;8e position&nbsp;au classement provisoire<\/li><\/ul><h5><br><\/h5><h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tef\/1\/16\/1f535.png\" alt=\"\ud83d\udd35\" height=\"16\" width=\"16\">&nbsp;\u00c9quipes DR3<\/strong><\/h5><ul><li>Jou\u00e9 2&nbsp;: 1 victoire, 1 nul, 1 d\u00e9faite<\/li><li><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;7e position&nbsp;\u2013 tout reste jouable, mais il va falloir serrer le jeu&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t52\/1\/16\/1f527.png\" alt=\"\ud83d\udd27\" height=\"16\" width=\"16\"><\/li><li>Jou\u00e9 4&nbsp;: premi\u00e8re saison en DR3<\/li><li><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;D\u00e9buts difficiles avec 2 d\u00e9faites, mais une&nbsp;belle victoire pour conclure la journ\u00e9e<\/li><li><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9e\/1\/16\/27a1.png\" alt=\"\u27a1\ufe0f\" height=\"16\" width=\"16\">&nbsp;8e position&nbsp;provisoire<\/li><\/ul><p><br><\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t6c\/1\/16\/1f499.png\" alt=\"\ud83d\udc99\" height=\"16\" width=\"16\">&nbsp;Bravo \u00e0 tous les joueurs, b\u00e9n\u00e9voles et encadrants<\/p><p>Ce tournoi montre que le BCJ est&nbsp;sur la bonne voie, sportivement et humainement.<\/p><p>L\u2019avenir s\u2019annonce prometteur&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t9a\/1\/16\/1f3b1.png\" alt=\"\ud83c\udfb1\" height=\"16\" width=\"16\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t50\/1\/16\/1f525.png\" alt=\"\ud83d\udd25\" height=\"16\" width=\"16\"><\/p><p><br><\/p><p><br><\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tfe\/1\/16\/1f3e8.png\" alt=\"\ud83c\udfe8\" height=\"16\" width=\"16\"> partenaires :<\/p><p>- Kyriad Jou\u00e9-l\u00e8s-Tours&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tb3\/1\/16\/1f517.png\" alt=\"\ud83d\udd17\" height=\"16\" width=\"16\">&nbsp;<a href=\"http:\/\/www.kyriad-tours-joue-les-tours.fr\/?fbclid=IwZXh0bgNhZW0CMTAAYnJpZBEwbmZ4VjJMa1RMcEk2dDI3cXNydGMGYXBwX2lkEDIyMjAzOTE3ODgyMDA4OTIAAR7-JfGNrJBUt-j9NAM6GnFzlUJr-GwWLjd182KVNl4Q3SrUmh7nqfHbsxQkDQ_aem_MQBpjc2WakouIFyPLhiUEg\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(0, 100, 209);\">www.kyriad-tours-joue-les-tours.fr<\/a><\/p><p>- Brit Hotel Jou\u00e9-l\u00e8s-Tours&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tb3\/1\/16\/1f517.png\" alt=\"\ud83d\udd17\" height=\"16\" width=\"16\">&nbsp;<a href=\"http:\/\/www.hotel-tours.brithotel.fr\/?fbclid=IwZXh0bgNhZW0CMTAAYnJpZBEwbmZ4VjJMa1RMcEk2dDI3cXNydGMGYXBwX2lkEDIyMjAzOTE3ODgyMDA4OTIAAR6ZOekG3EzV1DnO5WJUgM45NTYow7UwRSokVz2gUmyLLWj9YlFkwmiQXh1fLg_aem_V_g6Se1DiTswqF8N2k_e4w\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(0, 100, 209);\">www.hotel-tours.brithotel.fr<\/a><\/p><p><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t80\/1\/16\/1f64f.png\" alt=\"\ud83d\ude4f\" height=\"16\" width=\"16\">&nbsp;Un grand merci \u00e0 Bulldog-Billard pour son soutien et la qualit\u00e9 de ses \u00e9quipements&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tfe\/1\/16\/1f44f.png\" alt=\"\ud83d\udc4f\" height=\"16\" width=\"16\">&nbsp;<img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tb3\/1\/16\/1f517.png\" alt=\"\ud83d\udd17\" height=\"16\" width=\"16\">&nbsp;<a href=\"http:\/\/www.bulldog-billard.com\/?fbclid=IwZXh0bgNhZW0CMTAAYnJpZBEwbmZ4VjJMa1RMcEk2dDI3cXNydGMGYXBwX2lkEDIyMjAzOTE3ODgyMDA4OTIAAR7Mjws2HvxGwrWy1Yo2rIXLuqsCeE79eD8sckAas2fEWFeElhuDRqd7wwlMeA_aem_yIt4rsjXOSnoYLBwwDfR8Q\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(0, 100, 209);\">www.bulldog-billard.com<\/a>&nbsp;<\/p>","discipline":"blackball","discipline_id":1,"year":2025,"favoris":false,"image":"files\/a30f03dfbc77520c02094cd307716724.jpeg","image_url":"http:\/\/localhost:8000\/files\/a30f03dfbc77520c02094cd307716724.jpeg","video":null,"created_at":"2025-11-10T11:00:00.000000Z","updated_at":"2025-12-16T22:33:14.000000Z"},{"id":106,"title":"\ud83c\udfc5 Christophe Lambert s\u2019impose au tournoi national am\u00e9ricain \u2013 Jeu de la 10 \u2013 \u00e0 Cergy","slug":"christophe-lambert-simpose-au-tournoi-national-americain-jeu-de-la-10-a-cergy","excerpt":"Les 11 et 12 octobre 2025, le billard club de Cergy accueillait le premier tournoi national de billard am\u00e9ricain \u2013 Jeu de la 10 \u2013 de la saison, r\u00e9unis...","content":"<p>Les <strong>11 et 12 octobre 2025<\/strong>, le <strong>billard club de Cergy<\/strong> accueillait le <strong>premier tournoi national de billard am\u00e9ricain \u2013 Jeu de la 10 \u2013<\/strong> de la saison, r\u00e9unissant <strong>48 joueurs<\/strong> venus de toute la France.<\/p><p><br><\/p><p>Habituellement sp\u00e9cialiste du <strong>Blackball<\/strong>, <strong>Christophe Lambert<\/strong> a une nouvelle fois d\u00e9montr\u00e9 toute l\u2019\u00e9tendue de son talent en s\u2019imposant dans cette discipline voisine. Il a r\u00e9alis\u00e9 un <strong>parcours parfait<\/strong>, remportant <strong>tous ses matchs<\/strong>, dont la <strong>finale sur le score de 7 \u00e0 3<\/strong>.<\/p><p>Une victoire \u00e9clatante qui illustre sa polyvalence et son haut niveau de jeu, quelle que soit la table ou la discipline.<\/p><p><br><\/p><p>\ud83d\udd17 <strong>R\u00e9sultats complets sur CueScore :<\/strong><\/p><p><a href=\"https:\/\/urls.fr\/GKKbAa\" rel=\"noopener noreferrer\" target=\"_blank\">https:\/\/urls.fr\/GKKbAa<\/a><\/p>","discipline":"americain","discipline_id":4,"year":2025,"favoris":false,"image":null,"image_url":null,"video":"https:\/\/www.youtube.com\/embed\/kTjKBXM66rY","created_at":"2025-10-12T21:00:00.000000Z","updated_at":"2025-11-07T15:18:01.000000Z"},{"id":105,"title":"\ud83c\udfc6 Oph\u00e9lie Laval en 1\/8e de finale du 2025 Asian Open Women Heyball Championship","slug":"ophelie-laval-en-18e-de-finale-du-2025-asian-open-women-heyball-championship","excerpt":"Du 8 au 11 octobre 2025, le prestigieux Asian Open Women Heyball Championship s\u2019est tenu au Mena Tyche Hotel d\u2019Amman (Jordanie).Parmi les 29 participa...","content":"<p>Du <strong>8 au 11 octobre 2025<\/strong>, le prestigieux <strong>Asian Open Women Heyball Championship<\/strong> s\u2019est tenu au <strong>Mena Tyche Hotel d\u2019Amman (Jordanie)<\/strong>.<\/p><p><br><\/p><p>Parmi les <strong>29 participantes<\/strong>, la France \u00e9tait repr\u00e9sent\u00e9e par <strong>Oph\u00e9lie Laval<\/strong>, accompagn\u00e9e de <strong>Marion Jude<\/strong>.<\/p><p>Pour sa premi\u00e8re participation \u00e0 cette comp\u00e9tition d\u2019envergure internationale, Oph\u00e9lie a r\u00e9alis\u00e9 un beau parcours. Elle s\u2019est impos\u00e9e \u00e0 <strong>deux reprises<\/strong> avant de s\u2019incliner en <strong>1\/8e de finale<\/strong>, apr\u00e8s un match disput\u00e9 face \u00e0 une adversaire exp\u00e9riment\u00e9e.<\/p><p><br><\/p><p>Une performance encourageante qui confirme la progression d\u2019Oph\u00e9lie sur la sc\u00e8ne internationale et son engagement \u00e0 porter haut les couleurs fran\u00e7aises dans la discipline du Heyball.<\/p>","discipline":"americain","discipline_id":4,"year":2025,"favoris":false,"image":"files\/59afdf6a7bbc78807c32e6ab56d1d0aa.jpg","image_url":"http:\/\/localhost:8000\/files\/59afdf6a7bbc78807c32e6ab56d1d0aa.jpg","video":null,"created_at":"2025-10-12T10:00:00.000000Z","updated_at":"2025-10-12T10:00:00.000000Z"},{"id":104,"title":"Challenge V\u00e9t\u00e9rans : un bon d\u00e9part pour le BCJ !","slug":"challenge-veterans-un-bon-depart-pour-le-bcj","excerpt":"La premi\u00e8re journ\u00e9e du Challenge V\u00e9t\u00e9rans s\u2019est d\u00e9roul\u00e9e ce jeudi 2 octobre au club de Jou\u00e9-l\u00e8s-Tours.Nos trois \u00e9quipes \u00e9taient sur le pont pour cette...","content":"<p>La premi\u00e8re journ\u00e9e du <strong>Challenge V\u00e9t\u00e9rans<\/strong> s\u2019est d\u00e9roul\u00e9e ce <strong>jeudi 2 octobre<\/strong> au club de Jou\u00e9-l\u00e8s-Tours.<\/p><p><br><\/p><p>Nos trois \u00e9quipes \u00e9taient sur le pont pour cette reprise de la saison.<\/p><p>Le matin, <strong>Jou\u00e9 3<\/strong> s\u2019est impos\u00e9e avec autorit\u00e9 face \u00e0 <strong>Loches 3<\/strong> sur le score de <strong>12 \u00e0 4<\/strong>.<\/p><p>L\u2019apr\u00e8s-midi, les \u00e9quipes <strong>Jou\u00e9 1<\/strong> et <strong>Jou\u00e9 2<\/strong> se sont affront\u00e9es dans une rencontre \u00e9quilibr\u00e9e, qui s\u2019est sold\u00e9e par un <strong>match nul 8 \u00e0 8<\/strong>.<\/p><p><br><\/p><p>\u00c0 noter la belle performance de <strong>Jos\u00e9-Manuel Soares<\/strong> (deuxi\u00e8me \u00e0 partir de la gauche sur la photo) qui r\u00e9alise une <strong>moyenne de 4.286<\/strong> !<\/p><p><br><\/p><p>Une premi\u00e8re journ\u00e9e prometteuse pour nos V\u00e9t\u00e9rans, qui lancent de belle mani\u00e8re leur saison.<\/p><p><em>(Ci-joint : les deux \u00e9quipes de l\u2019apr\u00e8s-midi)<\/em><\/p>","discipline":"carambole","discipline_id":2,"year":2025,"favoris":false,"image":"files\/fce45db72e6f69ca306f219b5d6bbba2.png","image_url":"http:\/\/localhost:8000\/files\/fce45db72e6f69ca306f219b5d6bbba2.png","video":null,"created_at":"2025-10-03T10:00:00.000000Z","updated_at":"2025-10-12T21:42:26.000000Z"},{"id":103,"title":"Composition des \u00e9quipes carambole pour la saison 2025-2026","slug":"composition-des-equipes-carambole-pour-la-saison-2025-2026","excerpt":"","content":"<p><br><\/p>","discipline":"carambole","discipline_id":2,"year":2025,"favoris":false,"image":"files\/1962cfd2765918d1636b6b6ac26cb7c1.jpg","image_url":"http:\/\/localhost:8000\/files\/1962cfd2765918d1636b6b6ac26cb7c1.jpg","video":null,"created_at":"2025-09-20T10:00:00.000000Z","updated_at":"2025-09-21T10:00:00.000000Z"}],"meta":{"count":47,"current_page":1,"last_page":5,"per_page":10,"from":1,"to":10,"total":47},"links":{"first":"http:\/\/localhost:8000\/api\/v1\/posts?page=1","last":"http:\/\/localhost:8000\/api\/v1\/posts?page=5","prev":null,"next":"http:\/\/localhost:8000\/api\/v1\/posts?page=2"},"error":null}'
