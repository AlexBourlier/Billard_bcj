0.000000Z"},{"id":17,"name":"Kyriad Jou\u00e9-L\u00e8s-Tours","logo":"partenaires\/87d7527e-b0cc-43a8-ab2c-f9b17e9f950a.webp","logo_url":"http:\/\/localhost:8000\/partenaires\/87d7527e-b0cc-43a8-ab2c-f9b17e9f950a.webp","website_url":"https:\/\/tours-joue-les-tours.kyriad.com\/fr-fr\/?sr=SEO_GOOGLE","created_at":"2025-12-05T10:01:52.000000Z","updated_at":"2025-12-06T21:00:47.000000Z"}],"featured_post":{"id":112,"title":"2026 - Tournoi National n\u00b04 - Villeneuve-sur-Lot","slug":"2026-tournoi-national-n4-villeneuve-sur-lot","excerpt":"&nbsp;Du 31 janvier au 1er f\u00e9vrier 2026Un week-end intense pour nos joueurs, avec de tr\u00e8s beaux r\u00e9sultats \u00e0 la cl\u00e9.&nbsp;Blackball MasterVictoire d\u2019Al...","content":"<h5><strong style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t7e\/1\/16\/1f4c5.png\" alt=\"\ud83d\udcc5\" height=\"16\" width=\"16\">&nbsp;<em>Du 31 janvier au 1er f\u00e9vrier 2026<\/em><\/strong><\/h5><p class=\"ql-indent-1\">Un week-end intense pour nos joueurs, avec de tr\u00e8s beaux r\u00e9sultats \u00e0 la cl\u00e9.<\/p><p><br><\/p><h5><strong class=\"ql-size-large\" style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/tbe\/1\/16\/1f3c6.png\" alt=\"\ud83c\udfc6\" height=\"16\" width=\"16\">&nbsp;Blackball Master<\/strong><\/h5><ul><li>Victoire d\u2019Alex Buscetti&nbsp;\u2014&nbsp;<em>sa premi\u00e8re, et avec la mani\u00e8re !<\/em><\/li><\/ul><p class=\"ql-indent-2\">Score final :&nbsp;8\u20134, un match parfaitement ma\u00eetris\u00e9. Gr\u00e2ce \u00e0 cette performance,&nbsp;Alex grimpe \u00e0 la 3\u1d49 place du classement g\u00e9n\u00e9ral.<\/p><ul><li>&nbsp;Christophe Lambert&nbsp;s\u2019arr\u00eate en&nbsp;1\/2 finale<\/li><li>&nbsp;\u00c9lie Christidis&nbsp;atteint les&nbsp;1\/4 de finale<\/li><\/ul><p><br><\/p><h5><strong class=\"ql-size-large\" style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/te9\/1\/16\/2640.png\" alt=\"\u2640\ufe0f\" height=\"16\" width=\"16\">&nbsp;Cat\u00e9gorie F\u00e9minine<\/strong><\/h5><ul><li>Oph\u00e9lie Laval&nbsp;r\u00e9alise un tr\u00e8s beau parcours et atteint la&nbsp;finale<\/li><\/ul><p class=\"ql-indent-2\">Un jeu solide tout au long du tournoi, mais la victoire lui \u00e9chappe.<\/p><p class=\"ql-indent-2\">Elle se positionne d\u00e9sormais&nbsp;5\u1d49 au classement g\u00e9n\u00e9ral<\/p><p><br><\/p><h5><strong class=\"ql-size-large\" style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t8d\/1\/16\/1f500.png\" alt=\"\ud83d\udd00\" height=\"16\" width=\"16\">&nbsp;Cat\u00e9gorie Mixte<\/strong><\/h5><ul><li>J\u00e9r\u00f4me L''Anthoen&nbsp;atteint les&nbsp;1\/4 de finale&nbsp;apr\u00e8s&nbsp;4 matchs remport\u00e9s.<\/li><\/ul><p class=\"ql-indent-2\">Malgr\u00e9 une d\u00e9faite au 1er tour du tournoi v\u00e9t\u00e9ran, il r\u00e9alise une tr\u00e8s belle op\u00e9ration au mixte.<\/p><p class=\"ql-indent-2\">4\u1d49 place au classement g\u00e9n\u00e9ral&nbsp;!<\/p><p><br><\/p><h5><strong class=\"ql-size-large\" style=\"color: rgb(101, 104, 108);\"><img src=\"https:\/\/static.xx.fbcdn.net\/images\/emoji.php\/v9\/t8b\/1\/16\/1f465.png\" alt=\"\ud83d\udc65\" height=\"16\" width=\"16\">&nbsp;Comp\u00e9tition \u00c9quipes \u2013 DN1<\/strong><\/h5><ul><li><strong>Jou\u00e9 1<\/strong><\/li><\/ul><p class=\"ql-indent-2\">3 victoires en 3 matchs<\/p><p class=\"ql-indent-2\">Dernier match remport\u00e9 avec le&nbsp;point offensif&nbsp;et&nbsp;5 fermes<\/p><p class=\"ql-indent-2\">Jou\u00e9 1 conserve sa 2\u1d49 place au classement<\/p><ul><li><strong>Jou\u00e9 2<\/strong><\/li><\/ul><p class=\"ql-indent-2\">Victoire lors du premier match<\/p><p class=\"ql-indent-2\">D\u00e9faites sur les deux suivants, avec&nbsp;1 point d\u00e9fensif&nbsp;r\u00e9cup\u00e9r\u00e9<\/p><p class=\"ql-indent-2\">Une journ\u00e9e compliqu\u00e9e qui les fait descendre \u00e0 la&nbsp;4\u1d49 place<\/p><p class=\"ql-indent-2\"><em>Mais rien n\u2019est jou\u00e9 : la saison continue !<\/em><\/p><p><br><\/p><p><br><\/p><p>F\u00e9licitations \u00e0 l\u2019ensemble des joueurs pour leur engagement et leurs performances<\/p>","discipline":"blackball","discipline_id":1,"year":2026,"favoris":true,"image":null,"image_url":null,"video":"https:\/\/sportenfrance.com\/videos\/x9yzs4s","created_at":"2026-02-02T08:11:13.000000Z","updated_at":"2026-02-02T08:31:49.000000Z"}},"meta":{"menus_count":5,"partners_count":8,"has_featured_post":true},"links":[],"error":null}'
